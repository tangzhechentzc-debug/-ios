[package]
name = "changelocation-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "changelocation"
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "89702099f4d7552f704f93b4526756abda319ceb", default-features = false, features = ["ring", "remote_pairing", "tcp", "tunnel_tcp_stack", "rsd", "dvt", "location_simulation"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
